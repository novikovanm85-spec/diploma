<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Создать грамоту | ROCK QUIZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Russo+One&family=Oswald:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: #1a1a1a;
            border-radius: 20px;
            padding: 30px;
            border: 1px solid #cc3333;
        }
        h1 { 
            font-family: 'Russo One', sans-serif;
            color: #cc3333; 
            text-align: center; 
            margin-bottom: 25px; 
            font-size: 1.8rem; 
        }
        label { 
            font-family: 'Oswald', sans-serif;
            color: #cc3333; 
            display: block; 
            margin-bottom: 5px; 
            font-weight: 600;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        button {
            background: #cc3333;
            color: white;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:disabled { background: #555; cursor: not-allowed; }
        .error {
            background: rgba(204,51,51,0.2);
            padding: 10px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
            color: #ff8888;
        }
        .hint {
            font-size: 0.75rem;
            color: #aa8888;
            margin-top: -15px;
            margin-bottom: 15px;
        }
        .footer { text-align: center; font-size: 0.7rem; color: #666; margin-top: 20px; }
        .hidden { display: none; }

        /* ===== СТИЛИ ГРАМОТЫ (как на первой картинке — светлый фон, белый текст) ===== */
        .diploma {
            background: url('back.jpg') center/cover no-repeat;
            background-color: #8B0000;
            padding: 40px 25px;
            border-radius: 15px;
            margin-top: 20px;
            border: 3px solid #cc3333;
        }
        /* Прозрачный слой — почти незаметный, чтобы фон был виден, но текст читался */
        .diploma-content {
            background: rgba(0, 0, 0, 0.25);
            padding: 25px 20px;
            border-radius: 12px;
            text-align: center;
        }
        .logo {
            display: block;
            margin: 0 auto 15px auto;
            width: 80px;
            height: auto;
        }
        .diploma-header h2 {
            font-family: 'Russo One', sans-serif;
            color: #ffffff;
            font-size: 2rem;
            margin-bottom: 5px;
            letter-spacing: 3px;
            text-shadow: 2px 2px 0 #8B0000;
        }
        .diploma-header p {
            font-family: 'Inter', sans-serif;
            color: #f5e6d3;
            font-size: 1rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .award-text {
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            margin: 15px 0 10px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 1px 1px 0 #8B0000;
        }
        /* Список имён — каждое с новой строки, белый цвет */
        .names-list {
            font-family: 'Bebas Neue', cursive;
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #ffffff;
            margin: 15px 0;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            text-shadow: 1px 1px 0 #5a0000;
        }
        .names-list span {
            display: block;
            margin: 4px 0;
            line-height: 1.35;
        }
        /* Номинация — без жёлтого! Белый с лёгким оттенком */
        .nomination {
            font-family: 'Oswald', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: #ffffff;
            margin: 15px 0;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0 #8B0000;
        }
        .date {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            margin-top: 20px;
            color: #f0e0d0;
            font-weight: 500;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .button-group button {
            flex: 1;
            margin-top: 0;
        }

        /* ПЕЧАТЬ НА А4 — полный лист */
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            .container, .footer, .hidden, #errorDiv, button, .button-group, .diploma > .button-group {
                display: none !important;
            }
            .diploma {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 20px;
                border-radius: 0;
                border: 2px solid #cc3333;
                page-break-after: avoid;
                page-break-inside: avoid;
            }
            .diploma-content {
                width: 100%;
                height: 100%;
                min-height: 277mm;
                display: flex;
                flex-direction: column;
                justify-content: center;
                background: rgba(0, 0, 0, 0.3);
                padding: 30px;
            }
            .names-list span {
                font-size: 1.4rem;
            }
            * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <h1>🏆 ROCK QUIZ · ГРАМОТА</h1>
        
        <div id="formDiv">
            <label>👥 ИМЕНА УЧАСТНИКОВ</label>
            <textarea id="participantNames" placeholder="Введите имена через запятую, например:&#10;Иван Гаврин, Арсений Тимофей, Милана Глушкова, Дарья Пушилина, Юлия Колган, Керло Язлюк"></textarea>
            <div class="hint">💡 Каждое имя пишите через запятую. На грамоте они будут на отдельных строчках!</div>
            
            <label>🏷️ НАЗВАНИЕ КОМАНДЫ (необязательно)</label>
            <input type="text" id="teamName" placeholder="Например: ЯНЬЧАРЫ">
            
            <label>🎸 НОМИНАЦИЯ / МЕСТО</label>
            <select id="nomination">
                <option value="🥇 1 место">🥇 1 место</option>
                <option value="🥈 2 место">🥈 2 место</option>
                <option value="🥉 3 место">🥉 3 место</option>
                <option value="🌟 Приз зрительских симпатий">🌟 Приз зрительских симпатий</option>
                <option value="🎸 Лучший капитан">🎸 Лучший капитан</option>
                <option value="⚡ За волю к победе">⚡ За волю к победе</option>
            </select>
            
            <button id="generateBtn">СОЗДАТЬ ГРАМОТУ</button>
        </div>
        
        <div id="diplomaDiv" class="hidden"></div>
        <div id="errorDiv" class="error hidden"></div>
        <div class="footer">📸 Скачайте PNG или нажмите «Печать» — грамота заполнит лист А4</div>
    </div>

    <script>
        let isProcessing = false;
        
        function parseNames(input) {
            if (!input.trim()) return [];
            if (input.includes(',')) {
                return input.split(',').map(n => n.trim()).filter(n => n);
            }
            if (input.includes(';')) {
                return input.split(';').map(n => n.trim()).filter(n => n);
            }
            if (input.includes('\n')) {
                return input.split('\n').map(n => n.trim()).filter(n => n);
            }
            return [input.trim()];
        }
        
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function showDiploma(namesArray, teamName, nomination) {
            const diplomaDiv = document.getElementById('diplomaDiv');
            const displayTeam = teamName ? `${teamName} · ` : '';
            
            let namesHtml = '';
            for (let i = 0; i < namesArray.length; i++) {
                namesHtml += `<span>${escapeHtml(namesArray[i])}</span>`;
            }
            
            diplomaDiv.innerHTML = `
                <div class="diploma" id="diplomaToDownload">
                    <div class="diploma-content">
                        <div class="diploma-header">
                            <img src="logo.jpg" alt="ROCK QUIZ" class="logo" onerror="this.style.display='none'">
                            <h2>ROCK QUIZ</h2>
                            <p>Музыкальная битва</p>
                        </div>
                        <div class="award-text">НАГРАЖДАЕТСЯ</div>
                        <div class="names-list">${namesHtml}</div>
                        <div class="nomination">${displayTeam}${nomination}</div>
                        <div class="date">г. Липецк, 28 мая 2026 года | Рок-олимп гремит!</div>
                    </div>
                </div>
                <div class="button-group">
                    <button id="downloadBtn" style="background: #1a6e1a;">💾 СКАЧАТЬ PNG</button>
                    <button id="printBtn" style="background: #2a5f8a;">🖨️ ПЕЧАТЬ (А4)</button>
                </div>
            `;
            diplomaDiv.classList.remove('hidden');
            
            // Скачивание PNG
            document.getElementById('downloadBtn').addEventListener('click', async () => {
                const element = document.getElementById('diplomaToDownload');
                try {
                    const btn = document.getElementById('downloadBtn');
                    btn.textContent = '⏳ СОХРАНЕНИЕ...';
                    btn.disabled = true;
                    const canvas = await html2canvas(element, { scale: 2.5, backgroundColor: null, useCORS: true });
                    const link = document.createElement('a');
                    let fileName = 'gramota';
                    if (namesArray.length > 0) {
                        fileName = `gramota_${namesArray[0].replace(/\s/g, '_')}`;
                    }
                    link.download = `${fileName}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    btn.textContent = '💾 СКАЧАТЬ PNG';
                    btn.disabled = false;
                } catch(err) {
                    alert('Ошибка при сохранении грамоты');
                    document.getElementById('downloadBtn').textContent = '💾 СКАЧАТЬ PNG';
                    document.getElementById('downloadBtn').disabled = false;
                }
            });
            
            // Печать на А4
            document.getElementById('printBtn').addEventListener('click', () => {
                const diplomaElement = document.getElementById('diplomaToDownload').cloneNode(true);
                const printWindow = window.open('', '_blank');
                printWindow.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>ROCK QUIZ Грамота</title>
                        <meta charset="UTF-8">
                        <style>
                            * {
                                margin: 0;
                                padding: 0;
                                box-sizing: border-box;
                            }
                            body {
                                background: white;
                                margin: 0;
                                padding: 0;
                                width: 100%;
                                height: 100%;
                            }
                            .diploma {
                                background: url('back.jpg') center/cover no-repeat;
                                background-color: #8B0000;
                                width: 100%;
                                height: 100%;
                                min-height: 297mm;
                                border: 2px solid #cc3333;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                padding: 20mm;
                            }
                            .diploma-content {
                                background: rgba(0, 0, 0, 0.25);
                                width: 100%;
                                height: 100%;
                                display: flex;
                                flex-direction: column;
                                justify-content: center;
                                text-align: center;
                                padding: 30px;
                                border-radius: 12px;
                            }
                            .logo { width: 90px; margin: 0 auto 15px auto; }
                            .diploma-header h2 { 
                                font-family: 'Russo One', sans-serif; 
                                color: #ffffff; 
                                font-size: 2.2rem; 
                                text-shadow: 2px 2px 0 #8B0000;
                            }
                            .diploma-header p { 
                                color: #f5e6d3; 
                                font-size: 1rem; 
                                margin-top: 5px;
                            }
                            .award-text { 
                                font-size: 1.2rem; 
                                color: #ffffff; 
                                margin: 20px 0;
                                font-weight: 600;
                            }
                            .names-list { 
                                font-family: 'Bebas Neue', cursive; 
                                font-size: 1.5rem; 
                                color: white; 
                                background: rgba(0,0,0,0.3); 
                                padding: 18px; 
                                border-radius: 15px; 
                            }
                            .names-list span { display: block; margin: 5px 0; }
                            .nomination { 
                                font-size: 1.15rem; 
                                color: #ffffff; 
                                margin: 20px 0;
                                font-weight: 600;
                            }
                            .date { color: #f0e0d0; margin-top: 20px; font-size: 0.85rem; }
                            @media print {
                                body {
                                    margin: 0;
                                    padding: 0;
                                }
                                .diploma {
                                    position: absolute;
                                    top: 0;
                                    left: 0;
                                    width: 100%;
                                    height: 100%;
                                    min-height: 297mm;
                                    padding: 0;
                                    margin: 0;
                                    border-radius: 0;
                                }
                                * {
                                    -webkit-print-color-adjust: exact;
                                    print-color-adjust: exact;
                                }
                            }
                        </style>
                    </head>
                    <body>
                        ${diplomaElement.outerHTML}
                        <script>
                            window.onload = () => {
                                setTimeout(() => {
                                    window.print();
                                    setTimeout(() => window.close(), 500);
                                }, 200);
                            };
                        <\/script>
                    </body>
                    </html>
                `);
                printWindow.document.close();
            });
        }
        
        document.getElementById('generateBtn').addEventListener('click', async () => {
            if (isProcessing) return;
            
            const namesInput = document.getElementById('participantNames').value;
            const teamName = document.getElementById('teamName').value.trim();
            const nomination = document.getElementById('nomination').value;
            const errorDiv = document.getElementById('errorDiv');
            const formDiv = document.getElementById('formDiv');
            const generateBtn = document.getElementById('generateBtn');
            
            let namesArray = parseNames(namesInput);
            
            if (namesArray.length === 0) {
                errorDiv.innerHTML = '❌ Введите хотя бы одно имя участника! Используйте запятые для разделения.';
                errorDiv.classList.remove('hidden');
                return;
            }
            
            errorDiv.classList.add('hidden');
            isProcessing = true;
            generateBtn.disabled = true;
            generateBtn.textContent = 'СОЗДАНИЕ...';
            
            formDiv.classList.add('hidden');
            showDiploma(namesArray, teamName, nomination);
            
            generateBtn.disabled = false;
            isProcessing = false;
        });
        
        // Предзаполнение как на картинках
        document.getElementById('participantNames').value = 'Иван Керло, Арсений Гаврин, Тимофей Глушков, Милана Пушилина, Дарья Колган, Юлия Язлюк';
        document.getElementById('teamName').value = 'ЯНЬЧАРЫ';
        document.getElementById('nomination').value = '🥇 1 место';
    </script>
</body>
</html>
