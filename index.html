<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Создать грамоту | Музыкальный Квиз</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Russo+One&family=Oswald:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0000;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: #1a1a1a;
            border-radius: 20px;
            padding: 30px;
            border: 1px solid #cc0000;
        }
        h1 { 
            font-family: 'Russo One', sans-serif;
            color: #cc0000; 
            text-align: center; 
            margin-bottom: 25px; 
            font-size: 1.8rem; 
        }
        label { 
            font-family: 'Oswald', sans-serif;
            color: #cc0000; 
            display: block; 
            margin-bottom: 5px; 
            font-weight: 600;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        button {
            background: #cc0000;
            color: white;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:disabled { background: #555; cursor: not-allowed; }
        .error {
            background: rgba(204,0,0,0.2);
            padding: 10px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
            color: #ff8888;
        }
        .diploma {
            background: url('back.jpg') center/cover no-repeat;
            background-color: #0a0a0a;
            padding: 30px 20px;
            border-radius: 15px;
            margin-top: 20px;
            border: 3px solid #cc0000;
        }
        .logo {
            display: block;
            margin: 0 auto 15px auto;
            width: 80px;
            height: auto;
        }
        .diploma-content {
            background: rgba(0,0,0,0.6);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .diploma-header h2 {
            font-family: 'Russo One', sans-serif;
            color: #ff5555;
            font-size: 1.8rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .diploma-header p {
            font-family: 'Inter', sans-serif;
            color: #dddddd;
            font-size: 1rem;
            margin-bottom: 20px;
        }
        .award-text {
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            margin: 20px 0 10px;
            font-weight: 600;
            color: #ffcc88;
        }
        /* СТИЛЬ ДЛЯ СПИСКА ИМЁН (каждое с новой строки) */
        .names-list {
            font-family: 'Bebas Neue', cursive;
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #ffffff;
            margin: 15px 0;
            padding: 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 15px;
            text-align: center;
        }
        .names-list span {
            display: block;
            margin: 5px 0;
            line-height: 1.3;
        }
        .nomination {
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffaa33;
            margin: 15px 0;
        }
        .date {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            margin-top: 20px;
            color: #dddddd;
        }
        .hidden { display: none; }
        .footer { text-align: center; font-size: 0.7rem; color: #666; margin-top: 20px; }
        .hint {
            font-size: 0.75rem;
            color: #aa8888;
            margin-top: -15px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <h1>🏆 СОЗДАТЬ ГРАМОТУ</h1>
        
        <div id="formDiv">
            <label>👥 ИМЕНА УЧАСТНИКОВ</label>
            <textarea id="participantNames" placeholder="Введите имена через запятую, например:&#10;Иван Гаврин, Арсений Тимофей, Милана Глушкова, Дарья Пушилина, Юлия Колган, Керло Язлюк"></textarea>
            <div class="hint">💡 Каждое имя пишите через запятую. Тогда на грамоте они будут на отдельных строчках.</div>
            
            <label>🏷️ НАЗВАНИЕ КОМАНДЫ (необязательно)</label>
            <input type="text" id="teamName" placeholder="Например: Янчары · 🎵 1 место">
            
            <label>🎸 НОМИНАЦИЯ / МЕСТО</label>
            <select id="nomination">
                <option value="🥇 1 место">🥇 1 место</option>
                <option value="🥈 2 место">🥈 2 место</option>
                <option value="🥉 3 место">🥉 3 место</option>
                <option value="🌟 Приз зрительских симпатий">🌟 Приз зрительских симпатий</option>
                <option value="🎸 Лучший капитан">🎸 Лучший капитан</option>
                <option value="⚡ За волю к победе">⚡ За волю к победе</option>
            </select>
            
            <button id="generateBtn">СОЗДАТЬ ГРАМОТУ</button>
        </div>
        
        <div id="diplomaDiv" class="hidden"></div>
        <div id="errorDiv" class="error hidden"></div>
        <div class="footer">📸 Грамота сохраняется в виде картинки | 🖨️ При печати выберите масштаб 100% для А4</div>
    </div>

    <script>
        let isProcessing = false;
        
        // Функция для разбора имён (поддерживает запятые, точки с запятой, переводы строк)
        function parseNames(input) {
            if (!input.trim()) return [];
            
            // Сначала пробуем разделить по запятой
            if (input.includes(',')) {
                return input.split(',').map(n => n.trim()).filter(n => n);
            }
            // Если запятых нет, пробуем по точке с запятой
            if (input.includes(';')) {
                return input.split(';').map(n => n.trim()).filter(n => n);
            }
            // Если нет разделителей, пробуем по переводу строки
            if (input.includes('\n')) {
                return input.split('\n').map(n => n.trim()).filter(n => n);
            }
            // Иначе возвращаем как одно имя
            return [input.trim()];
        }
        
        // Функция отображения грамоты
        function showDiploma(namesArray, teamName, nomination) {
            const diplomaDiv = document.getElementById('diplomaDiv');
            const displayTeam = teamName ? `${teamName} · ` : '';
            
            // Создаём HTML для каждого имени в отдельной строке
            let namesHtml = '';
            for (let i = 0; i < namesArray.length; i++) {
                namesHtml += `<span>${escapeHtml(namesArray[i])}</span>`;
            }
            
            diplomaDiv.innerHTML = `
                <div class="diploma" id="diplomaToDownload">
                    <div class="diploma-content">
                        <div class="diploma-header">
                            <img src="logo.jpg" alt="Логотип" class="logo" onerror="this.style.display='none'">
                            <h2>ROCK QUIZ</h2>
                            <p>Музыкальная битва</p>
                        </div>
                        <div class="award-text">🏅 НАГРАЖДАЕТСЯ</div>
                        <div class="names-list">${namesHtml}</div>
                        <div class="nomination">${displayTeam}${nomination}</div>
                        <div class="date">г. Липецк, 28 мая 2026 года | Рок-олимп гремит!</div>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap;">
                    <button id="downloadBtn" style="background: #1a6e1a;">💾 СКАЧАТЬ PNG</button>
                    <button id="printBtn" style="background: #2a5f8a;">🖨️ ПЕЧАТЬ (А4)</button>
                </div>
            `;
            diplomaDiv.classList.remove('hidden');
            
            // Скачивание PNG
            document.getElementById('downloadBtn').addEventListener('click', async () => {
                const element = document.getElementById('diplomaToDownload');
                try {
                    const btn = document.getElementById('downloadBtn');
                    btn.textContent = '⏳ СОХРАНЕНИЕ...';
                    btn.disabled = true;
                    const canvas = await html2canvas(element, { scale: 2.5, backgroundColor: '#ffffff' });
                    const link = document.createElement('a');
                    let fileName = 'gramota';
                    if (namesArray.length > 0) {
                        fileName = `gramota_${namesArray[0].replace(/\s/g, '_')}`;
                    }
                    link.download = `${fileName}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    btn.textContent = '💾 СКАЧАТЬ PNG';
                    btn.disabled = false;
                } catch(err) {
                    alert('Ошибка при сохранении грамоты');
                    document.getElementById('downloadBtn').textContent = '💾 СКАЧАТЬ PNG';
                    document.getElementById('downloadBtn').disabled = false;
                }
            });
            
            // Печать на А4
            document.getElementById('printBtn').addEventListener('click', () => {
                const originalContent = document.body.innerHTML;
                const diplomaHtml = document.getElementById('diplomaToDownload').cloneNode(true);
                
                const printWindow = window.open('', '_blank');
                printWindow.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>ROCK QUIZ Грамота</title>
                        <meta charset="UTF-8">
                        <style>
                            * { margin: 0; padding: 0; box-sizing: border-box; }
                            body {
                                background: white;
                                display: flex;
                                justify-content: center;
                                align-items: center;
                                min-height: 100vh;
                                margin: 0;
                                padding: 20px;
                            }
                            .print-diploma {
                                width: 100%;
                                max-width: 900px;
                                margin: 0 auto;
                            }
                            .diploma {
                                background: url('back.jpg') center/cover no-repeat;
                                padding: 40px 30px;
                                border: 3px solid #cc0000;
                                border-radius: 15px;
                            }
                            .diploma-content {
                                background: rgba(0,0,0,0.65);
                                padding: 30px;
                                border-radius: 15px;
                                text-align: center;
                            }
                            .logo { width: 100px; margin-bottom: 15px; }
                            .diploma-header h2 { font-family: 'Russo One', sans-serif; color: #ff5555; font-size: 2.2rem; }
                            .diploma-header p { color: #ddd; font-size: 1rem; margin-top: 5px; }
                            .award-text { font-size: 1.3rem; color: #ffcc88; margin: 20px 0; }
                            .names-list { font-family: 'Bebas Neue', cursive; font-size: 1.8rem; color: white; background: rgba(0,0,0,0.5); padding: 20px; border-radius: 15px; }
                            .names-list span { display: block; margin: 8px 0; }
                            .nomination { font-size: 1.3rem; color: #ffaa33; margin: 20px 0; }
                            .date { color: #ccc; margin-top: 20px; }
                            @media print {
                                body { padding: 0; margin: 0; }
                                .print-diploma { max-width: 100%; }
                                .diploma { border: 2px solid #cc0000; }
                                * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                            }
                        </style>
                    </head>
                    <body>
                        <div class="print-diploma">${diplomaHtml.outerHTML}</div>
                        <script>
                            window.onload = () => {
                                setTimeout(() => {
                                    window.print();
                                    setTimeout(() => window.close(), 500);
                                }, 200);
                            };
                        <\/script>
                    </body>
                    </html>
                `);
                printWindow.document.close();
            });
        }
        
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Обработчик кнопки
        document.getElementById('generateBtn').addEventListener('click', async () => {
            if (isProcessing) return;
            
            const namesInput = document.getElementById('participantNames').value;
            const teamName = document.getElementById('teamName').value.trim();
            const nomination = document.getElementById('nomination').value;
            const errorDiv = document.getElementById('errorDiv');
            const formDiv = document.getElementById('formDiv');
            const generateBtn = document.getElementById('generateBtn');
            
            // Разбираем имена
            let namesArray = parseNames(namesInput);
            
            if (namesArray.length === 0) {
                errorDiv.innerHTML = '❌ Введите хотя бы одно имя участника! Используйте запятые для разделения.';
                errorDiv.classList.remove('hidden');
                return;
            }
            
            errorDiv.classList.add('hidden');
            isProcessing = true;
            generateBtn.disabled = true;
            generateBtn.textContent = 'СОЗДАНИЕ...';
            
            formDiv.classList.add('hidden');
            showDiploma(namesArray, teamName, nomination);
            
            generateBtn.disabled = false;
            isProcessing = false;
        });
        
        // Пример из вашей картинки (предзаполнение)
        document.getElementById('participantNames').value = 'Иван Гаврин, Арсений Тимофей, Милана Глушкова, Дарья Пушилина, Юлия Колган, Керло Язлюк';
        document.getElementById('teamName').value = 'Янчары';
        document.getElementById('nomination').value = '🥇 1 место';
    </script>
</body>
</html>
