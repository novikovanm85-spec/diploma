<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Создать грамоту | ROCK QUIZ — музыкальная битва</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Russo+One&family=Oswald:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Inter', sans-serif;
            padding: 24px 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 560px;
            width: 100%;
            background: #121212;
            border-radius: 32px;
            padding: 28px 26px 34px;
            border: 1px solid #cc3a3a;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-family: 'Russo One', sans-serif;
            color: #dd3b3b;
            text-align: center;
            margin-bottom: 28px;
            font-size: 2rem;
            letter-spacing: 1px;
        }

        label {
            font-family: 'Oswald', sans-serif;
            color: #dd3b3b;
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 22px;
            background: #202020;
            border: 1px solid #3e3e3e;
            color: #f2f2f2;
            border-radius: 14px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #dd3b3b;
            background: #2a2a2a;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            background: #dd3b3b;
            color: white;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 2px;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 60px;
            cursor: pointer;
            margin-top: 8px;
            transition: transform 0.1s ease, background 0.2s;
        }

        button:active {
            transform: scale(0.97);
        }

        button:disabled {
            background: #6e3a3a;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .error {
            background: rgba(221, 59, 59, 0.2);
            padding: 12px;
            border-radius: 18px;
            margin-top: 18px;
            text-align: center;
            color: #ffa2a2;
            font-weight: 500;
        }

        .hint {
            font-size: 0.75rem;
            color: #b77e7e;
            margin-top: -14px;
            margin-bottom: 16px;
        }

        .footer {
            text-align: center;
            font-size: 0.7rem;
            color: #777;
            margin-top: 24px;
        }

        .hidden {
            display: none;
        }

        /* СТИЛИ ГРАМОТЫ — светлый фон, белый текст, БЕЗ лишней фразы */
        .diploma {
            background: url('back.jpg') center/cover no-repeat;
            background-color: #9e2b2b;
            padding: 36px 20px;
            border-radius: 24px;
            margin-top: 24px;
            border: 3px solid #dd3b3b;
        }

        /* Очень светлый слой — фон максимально виден */
        .diploma-content {
            background: rgba(0, 0, 0, 0.15);
            padding: 24px 20px;
            border-radius: 20px;
            text-align: center;
        }

        .logo {
            display: block;
            margin: 0 auto 12px auto;
            width: 80px;
            height: auto;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
        }

        .diploma-header h2 {
            font-family: 'Russo One', sans-serif;
            color: #ffffff;
            font-size: 2.2rem;
            margin-bottom: 6px;
            letter-spacing: 3px;
            text-shadow: 2px 2px 0 #6b1a1a;
        }

        .diploma-header p {
            font-family: 'Inter', sans-serif;
            color: #f8efdc;
            font-size: 1rem;
            margin-bottom: 12px;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .award-text {
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            margin: 14px 0 8px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 1px 1px 0 #7e2222;
        }

        /* Имена — каждое с новой строки */
        .names-list {
            font-family: 'Bebas Neue', cursive;
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #ffffff;
            margin: 16px 0;
            padding: 16px 16px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 24px;
            text-shadow: 1px 1px 0 #4f1515;
        }

        .names-list span {
            display: block;
            margin: 4px 0;
            line-height: 1.4;
        }

        /* Номинация — белая, без жёлтого */
        .nomination {
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            margin: 14px 0 10px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0 #6e1e1e;
        }

        /* ТОЛЬКО город и дата — БЕЗ "Рок-олимп гремит" */
        .date {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            margin-top: 18px;
            color: #f0e0c0;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .button-group button {
            flex: 1;
            margin-top: 0;
            font-size: 1rem;
            padding: 12px;
        }

        /* ПЕЧАТЬ НА А4 — полный лист */
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }

            .container, .footer, .hidden, #errorDiv, button, .button-group, .diploma > .button-group {
                display: none !important;
            }

            .diploma {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 28px 24px;
                border-radius: 0;
                border: 2px solid #cc3a3a;
                page-break-after: avoid;
                page-break-inside: avoid;
                background-color: #9e2b2b;
            }

            .diploma-content {
                width: 100%;
                height: 100%;
                min-height: 280mm;
                display: flex;
                flex-direction: column;
                justify-content: center;
                background: rgba(0, 0, 0, 0.15);
                padding: 24px 20px;
            }

            .names-list span {
                font-size: 1.5rem;
            }

            * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }

        @media (max-width: 520px) {
            .diploma {
                padding: 20px 12px;
            }
            .names-list {
                font-size: 1.3rem;
                padding: 12px;
            }
            .diploma-header h2 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <h1>🎸 ROCK QUIZ · ГРАМОТА</h1>

        <div id="formDiv">
            <label>👥 ИМЕНА УЧАСТНИКОВ (через запятую)</label>
            <textarea id="participantNames"
                placeholder="Пример:&#10;Иван Гаврин, Арсений Тимофей, Милана Глушкова, Дарья Пушилина, Юлия Колган, Керло Язлюк"></textarea>
            <div class="hint">✍️ Каждое имя пишите через запятую — на грамоте они будут на отдельных строках.</div>

            <label>🏷️ КОМАНДА (необязательно)</label>
            <input type="text" id="teamName" placeholder="Например: ЯНЬЧАРЫ · 1 место">

            <label>🏆 НОМИНАЦИЯ / МЕСТО</label>
            <select id="nomination">
                <option value="🥇 1 место">🥇 1 место</option>
                <option value="🥈 2 место">🥈 2 место</option>
                <option value="🥉 3 место">🥉 3 место</option>
                <option value="🌟 Приз зрительских симпатий">🌟 Приз зрительских симпатий</option>
                <option value="🎸 Лучший капитан">🎸 Лучший капитан</option>
                <option value="⚡ За волю к победе">⚡ За волю к победе</option>
                <option value="🔥 Рок-прорыв">🔥 Рок-прорыв</option>
            </select>

            <button id="generateBtn">✨ СОЗДАТЬ ГРАМОТУ ✨</button>
        </div>

        <div id="diplomaDiv" class="hidden"></div>
        <div id="errorDiv" class="error hidden"></div>
        <div class="footer">📸 Скачайте PNG или нажмите «Печать» — грамота заполнит лист А4 полностью</div>
    </div>

    <script>
        let isProcessing = false;

        function parseNames(input) {
            if (!input || !input.trim()) return [];
            let raw = input.trim();
            if (raw.includes(',')) {
                return raw.split(',').map(n => n.trim()).filter(n => n);
            }
            if (raw.includes(';')) {
                return raw.split(';').map(n => n.trim()).filter(n => n);
            }
            if (raw.includes('\n')) {
                return raw.split('\n').map(n => n.trim()).filter(n => n);
            }
            return [raw];
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function showDiploma(namesArray, teamName, nomination) {
            const diplomaDiv = document.getElementById('diplomaDiv');
            const displayTeam = teamName && teamName.trim() !== "" ? `${escapeHtml(teamName)} · ` : "";

            let namesHtml = '';
            for (let i = 0; i < namesArray.length; i++) {
                namesHtml += `<span>${escapeHtml(namesArray[i])}</span>`;
            }

            // ВНИМАНИЕ: внизу ТОЛЬКО "г. Липецк, 28 мая 2026 года" — без всякой дополнительной фразы!
            diplomaDiv.innerHTML = `
                <div class="diploma" id="diplomaToDownload">
                    <div class="diploma-content">
                        <div class="diploma-header">
                            <img src="logo.jpg" alt="ROCK QUIZ" class="logo" onerror="this.style.display='none'">
                            <h2>ROCK QUIZ</h2>
                            <p>Музыкальная битва</p>
                        </div>
                        <div class="award-text">НАГРАЖДАЕТСЯ</div>
                        <div class="names-list">${namesHtml}</div>
                        <div class="nomination">${displayTeam}${escapeHtml(nomination)}</div>
                        <div class="date">г. Липецк, 28 мая 2026 года</div>
                    </div>
                </div>
                <div class="button-group">
                    <button id="downloadBtn" style="background: #178017;">💾 СКАЧАТЬ PNG</button>
                    <button id="printBtn" style="background: #1b6b9e;">🖨️ ПЕЧАТЬ (А4)</button>
                </div>
            `;
            diplomaDiv.classList.remove('hidden');

            // Скачивание PNG
            const downloadBtn = document.getElementById('downloadBtn');
            downloadBtn.addEventListener('click', async () => {
                const element = document.getElementById('diplomaToDownload');
                try {
                    downloadBtn.textContent = '⏳ СОХРАНЕНИЕ...';
                    downloadBtn.disabled = true;
                    const canvas = await html2canvas(element, {
                        scale: 2.8,
                        backgroundColor: null,
                        useCORS: true,
                        logging: false
                    });
                    const link = document.createElement('a');
                    let fileName = 'ROCK_gramota';
                    if (namesArray.length > 0) {
                        let firstClean = namesArray[0].replace(/\s+/g, '_');
                        fileName = `gramota_${firstClean}`;
                    }
                    link.download = `${fileName}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    downloadBtn.textContent = '💾 СКАЧАТЬ PNG';
                    downloadBtn.disabled = false;
                } catch (err) {
                    console.error(err);
                    alert('Ошибка при сохранении PNG');
                    downloadBtn.textContent = '💾 СКАЧАТЬ PNG';
                    downloadBtn.disabled = false;
                }
            });

            // Печать на А4
            const printBtn = document.getElementById('printBtn');
            printBtn.addEventListener('click', () => {
                const originalDiploma = document.getElementById('diplomaToDownload');
                const cloneDiploma = originalDiploma.cloneNode(true);
                const anyButtons = cloneDiploma.querySelectorAll('button');
                anyButtons.forEach(btn => btn.remove());

                const printWindow = window.open('', '_blank');
                if (!printWindow) {
                    alert('Разрешите всплывающие окна для печати');
                    return;
                }

                printWindow.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="UTF-8">
                        <title>ROCK QUIZ Грамота</title>
                        <style>
                            * {
                                margin: 0;
                                padding: 0;
                                box-sizing: border-box;
                            }
                            body {
                                background: white;
                                margin: 0;
                                padding: 0;
                                width: 100%;
                                height: 100%;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                            }
                            .diploma {
                                background: url('back.jpg') center/cover no-repeat;
                                background-color: #9e2b2b;
                                width: 100%;
                                height: 100%;
                                min-height: 297mm;
                                border: 2px solid #cc3a3a;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                padding: 20mm 18mm;
                            }
                            .diploma-content {
                                background: rgba(0, 0, 0, 0.15);
                                width: 100%;
                                height: 100%;
                                display: flex;
                                flex-direction: column;
                                justify-content: center;
                                text-align: center;
                                padding: 28px 24px;
                                border-radius: 20px;
                            }
                            .logo {
                                width: 95px;
                                margin: 0 auto 12px auto;
                                display: block;
                            }
                            .diploma-header h2 {
                                font-family: 'Russo One', sans-serif;
                                color: #ffffff;
                                font-size: 2.3rem;
                                text-shadow: 2px 2px 0 #6b1a1a;
                                letter-spacing: 3px;
                            }
                            .diploma-header p {
                                font-family: 'Inter', sans-serif;
                                color: #f8efdc;
                                font-size: 1rem;
                                margin-top: 6px;
                                font-weight: 500;
                            }
                            .award-text {
                                font-family: 'Oswald', sans-serif;
                                font-size: 1.25rem;
                                color: #ffffff;
                                margin: 18px 0 10px;
                                font-weight: 600;
                                letter-spacing: 2px;
                            }
                            .names-list {
                                font-family: 'Bebas Neue', cursive;
                                font-size: 1.6rem;
                                color: white;
                                background: rgba(0,0,0,0.25);
                                padding: 18px;
                                border-radius: 24px;
                                margin: 12px 0;
                            }
                            .names-list span {
                                display: block;
                                margin: 5px 0;
                                line-height: 1.4;
                            }
                            .nomination {
                                font-family: 'Oswald', sans-serif;
                                font-size: 1.2rem;
                                font-weight: 700;
                                color: #ffffff;
                                margin: 14px 0 8px;
                                text-shadow: 1px 1px 0 #6e1e1e;
                            }
                            .date {
                                font-family: 'Inter', sans-serif;
                                font-size: 0.85rem;
                                margin-top: 18px;
                                color: #f0e0c0;
                            }
                            @media print {
                                body {
                                    margin: 0;
                                    padding: 0;
                                }
                                .diploma {
                                    position: absolute;
                                    top: 0;
                                    left: 0;
                                    width: 100%;
                                    height: 100%;
                                    min-height: 297mm;
                                    padding: 18mm;
                                    margin: 0;
                                    border-radius: 0;
                                }
                                * {
                                    -webkit-print-color-adjust: exact;
                                    print-color-adjust: exact;
                                }
                            }
                        </style>
                    </head>
                    <body>
                        ${cloneDiploma.outerHTML}
                        <script>
                            window.onload = () => {
                                setTimeout(() => {
                                    window.print();
                                    setTimeout(() => window.close(), 600);
                                }, 200);
                            };
                        <\/script>
                    </body>
                    </html>
                `);
                printWindow.document.close();
            });
        }

        // Обработчик кнопки
        const generateBtn = document.getElementById('generateBtn');
        generateBtn.addEventListener('click', async () => {
            if (isProcessing) return;

            const namesRaw = document.getElementById('participantNames').value;
            const teamValue = document.getElementById('teamName').value.trim();
            const nominationValue = document.getElementById('nomination').value;
            const errorDiv = document.getElementById('errorDiv');
            const formDiv = document.getElementById('formDiv');
            const diplomaContainer = document.getElementById('diplomaDiv');

            let namesList = parseNames(namesRaw);

            if (namesList.length === 0) {
                errorDiv.innerHTML = '❌ Введите хотя бы одно имя! Разделяйте имена запятыми';
                errorDiv.classList.remove('hidden');
                return;
            }

            if (namesList.length > 28) {
                errorDiv.innerHTML = '⚠️ Слишком много имён (макс. 28)';
                errorDiv.classList.remove('hidden');
                return;
            }

            errorDiv.classList.add('hidden');
            isProcessing = true;
            generateBtn.disabled = true;
            generateBtn.textContent = '🎸 СОЗДАЁМ ГРАМОТУ...';

            formDiv.classList.add('hidden');
            diplomaContainer.classList.add('hidden');
            diplomaContainer.innerHTML = '';

            await new Promise(r => setTimeout(r, 30));
            showDiploma(namesList, teamValue, nominationValue);

            generateBtn.disabled = false;
            isProcessing = false;
            generateBtn.textContent = '✨ СОЗДАТЬ ГРАМОТУ ✨';
        });

        // ПРЕДЗАПОЛНЕНИЕ
        document.getElementById('participantNames').value = 'Иван Керло, Арсений Гаврин, Тимофей Глушков, Милана Пушилина, Дарья Колган, Юлия Язлюк';
        document.getElementById('teamName').value = 'ЯНЬЧАРЫ';
        document.getElementById('nomination').value = '🥇 1 место';
    </script>
</body>
</html>
